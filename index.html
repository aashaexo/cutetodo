<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>cutetodo</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600;700&family=Patrick+Hand&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    :root {
      --grid-bg: #f5f5f5;
      --grid-dot: #ccc;
      --card-bg: #2d2d2d;
      --card-text: #fff;
      --marker-color: #222;
      --toolbar-bg: #1a1a1a;
      --toolbar-text: #fff;
      --border-color: #bbb;
    }

    .theme-light {
      --grid-bg: #f5f5f5;
      --grid-dot: #ccc;
      --card-bg: #2d2d2d;
      --card-text: #fff;
      --marker-color: #222;
      --toolbar-bg: #1a1a1a;
      --toolbar-text: #fff;
      --border-color: #bbb;
    }

    .theme-dark {
      --grid-bg: #1a1a1a;
      --grid-dot: #333;
      --card-bg: #f5f5f0;
      --card-text: #111;
      --marker-color: #e0e0e0;
      --toolbar-bg: #111;
      --toolbar-text: #eee;
      --border-color: #444;
    }

    .theme-warm {
      --grid-bg: #fdf6e3;
      --grid-dot: #e0d5b7;
      --card-bg: #3b2e1a;
      --card-text: #fdf6e3;
      --marker-color: #5b3a1a;
      --toolbar-bg: #3b2e1a;
      --toolbar-text: #fdf6e3;
      --border-color: #c9b98a;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Patrick Hand', 'Segoe UI', system-ui, sans-serif;
      background: var(--grid-bg);
    }

    #app {
      width: 100%;
      height: 100%;
      position: relative;
    }

    /* Grid canvas (dots) */
    #grid-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 0;
    }

    /* Drawing canvas */
    #draw-canvas {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 1;
    }

    /* Cards layer */
    #cards-layer {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 100%;
      z-index: 2;
      pointer-events: none;
    }

    .card {
      position: absolute;
      background: var(--card-bg);
      color: var(--card-text);
      border-radius: 10px;
      padding: 16px;
      min-width: 180px;
      max-width: 300px;
      font-family: 'Caveat', cursive;
      font-size: 20px;
      line-height: 1.5;
      pointer-events: auto;
      cursor: grab;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
      user-select: none;
    }

    .card:active { cursor: grabbing; }

    .card .card-content {
      white-space: pre-wrap;
      outline: none;
      min-height: 20px;
    }

    .card .card-content:focus {
      cursor: text;
    }

    .card .delete-btn {
      position: absolute;
      top: -8px; right: -8px;
      width: 22px; height: 22px;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
      z-index: 10;
    }

    .card:hover .delete-btn { display: flex; }

    .card .checkbox {
      display: inline-block;
      width: 15px; height: 15px;
      border: 2px solid var(--card-text);
      border-radius: 3px;
      margin-right: 6px;
      vertical-align: middle;
      cursor: pointer;
      position: relative;
      opacity: 0.6;
    }

    .card .checkbox.checked {
      background: #4a9eff;
      border-color: #4a9eff;
      opacity: 1;
    }

    .card .checkbox.checked::after {
      content: '✓';
      position: absolute;
      top: -2px; left: 1px;
      color: #fff;
      font-size: 12px;
      font-weight: bold;
    }

    /* Toolbar */
    #toolbar {
      position: fixed;
      bottom: 0; left: 0; right: 0;
      height: 48px;
      background: var(--toolbar-bg);
      display: flex;
      align-items: center;
      padding: 0 16px;
      gap: 4px;
      z-index: 100;
    }

    .tool-btn {
      padding: 6px 16px;
      border: none;
      border-radius: 6px;
      font-family: 'Patrick Hand', sans-serif;
      font-size: 15px;
      font-weight: 400;
      cursor: pointer;
      color: var(--toolbar-text);
      background: transparent;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.15s;
    }

    .tool-btn:hover { background: rgba(255,255,255,0.1); }
    .tool-btn.active { background: #d4a017; color: #000; }

    .tool-btn .icon {
      width: 18px; height: 18px;
    }

    .separator {
      width: 1px;
      height: 24px;
      background: rgba(255,255,255,0.2);
      margin: 0 6px;
    }

    .spacer { flex: 1; }

    /* Theme picker */
    .theme-btn {
      width: 20px; height: 20px;
      border-radius: 50%;
      border: 2px solid rgba(255,255,255,0.3);
      cursor: pointer;
      transition: transform 0.15s, border-color 0.15s;
    }
    .theme-btn:hover { transform: scale(1.2); }
    .theme-btn.active-theme { border-color: #d4a017; transform: scale(1.2); }

    .theme-btn.tb-light { background: #f5f5f5; }
    .theme-btn.tb-dark { background: #1a1a1a; }
    .theme-btn.tb-warm { background: #fdf6e3; }

    #clear-btn {
      padding: 6px 14px;
      background: transparent;
      border: 1px solid rgba(255,255,255,0.2);
      color: var(--toolbar-text);
      border-radius: 6px;
      font-family: 'Patrick Hand', sans-serif;
      font-size: 14px;
      cursor: pointer;
    }
    #clear-btn:hover { background: rgba(255,255,255,0.1); }

    /* Text labels */
    .text-label {
      position: absolute;
      font-family: 'Caveat', cursive;
      font-size: 32px;
      font-weight: 700;
      color: var(--marker-color);
      background: none;
      border: none;
      outline: none;
      white-space: pre;
      cursor: grab;
      pointer-events: auto;
      min-width: 20px;
      line-height: 1.2;
    }

    .text-label:active { cursor: grabbing; }

    .text-label:focus {
      cursor: text;
      border-bottom: 2px dashed var(--marker-color);
    }

    .text-label .delete-btn {
      position: absolute;
      top: -10px; right: -10px;
      width: 22px; height: 22px;
      background: #e74c3c;
      color: #fff;
      border: none;
      border-radius: 50%;
      font-size: 12px;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      line-height: 1;
      z-index: 10;
    }

    .text-label:hover .delete-btn { display: flex; }

    /* Eraser cursor */
    .eraser-cursor {
      cursor: crosshair;
    }
  </style>
</head>
<body class="theme-light">
  <div id="app">
    <canvas id="grid-canvas"></canvas>
    <canvas id="draw-canvas"></canvas>
    <div id="cards-layer"></div>
  </div>

  <div id="toolbar">
    <button class="tool-btn active" data-tool="card" id="card-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/></svg>
      Card
    </button>
    <span class="separator"></span>
    <button class="tool-btn" data-tool="text" id="text-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 7V4h16v3"/><path d="M12 4v16"/><path d="M8 20h8"/></svg>
      Text
    </button>
    <span class="separator"></span>
    <button class="tool-btn" data-tool="marker" id="marker-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9M16.5 3.5a2.121 2.121 0 013 3L7 19l-4 1 1-4L16.5 3.5z"/></svg>
      Marker
    </button>
    <span class="separator"></span>
    <button class="tool-btn" data-tool="eraser" id="eraser-btn">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 20H7L3 16l9-9 8 8-4 5z"/><path d="M6.5 13.5l5 5"/></svg>
      Eraser
    </button>

    <span class="spacer"></span>

    <div style="display:flex;align-items:center;gap:8px;margin-right:16px;">
      <button class="theme-btn tb-light active-theme" data-theme="light" title="Light"></button>
      <button class="theme-btn tb-dark" data-theme="dark" title="Dark"></button>
      <button class="theme-btn tb-warm" data-theme="warm" title="Warm"></button>
    </div>

    <button id="clear-btn">Clear Canvas</button>
  </div>

  <script>
    // ── State ──
    let currentTool = 'card';
    let currentTheme = 'light';
    let cards = [];
    let textLabels = []; // array of {id, x, y, text, color}
    let textIdCounter = 0;
    let drawPaths = []; // array of {points, color, width}
    let isDrawing = false;
    let currentPath = null;
    let dragCard = null;
    let dragOffset = { x: 0, y: 0 };

    const gridCanvas = document.getElementById('grid-canvas');
    const gridCtx = gridCanvas.getContext('2d');
    const drawCanvas = document.getElementById('draw-canvas');
    const drawCtx = drawCanvas.getContext('2d');
    const cardsLayer = document.getElementById('cards-layer');

    // ── Theme config ──
    const themes = {
      light:  { gridBg: '#f5f5f5', gridDot: '#ccc', marker: '#222',    cardBg: '#2d2d2d', cardText: '#fff' },
      dark:   { gridBg: '#1a1a1a', gridDot: '#333', marker: '#e0e0e0', cardBg: '#f5f5f0', cardText: '#111' },
      warm:   { gridBg: '#fdf6e3', gridDot: '#e0d5b7', marker: '#5b3a1a', cardBg: '#3b2e1a', cardText: '#fdf6e3' },
    };

    // ── Resize ──
    function resize() {
      const dpr = window.devicePixelRatio || 1;
      gridCanvas.width = window.innerWidth * dpr;
      gridCanvas.height = window.innerHeight * dpr;
      gridCanvas.style.width = window.innerWidth + 'px';
      gridCanvas.style.height = window.innerHeight + 'px';
      gridCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      drawCanvas.width = window.innerWidth * dpr;
      drawCanvas.height = window.innerHeight * dpr;
      drawCanvas.style.width = window.innerWidth + 'px';
      drawCanvas.style.height = window.innerHeight + 'px';
      drawCtx.setTransform(dpr, 0, 0, dpr, 0, 0);

      drawGrid();
      redrawPaths();
    }

    window.addEventListener('resize', resize);

    // ── Draw Grid ──
    function drawGrid() {
      const t = themes[currentTheme];
      gridCtx.clearRect(0, 0, gridCanvas.width, gridCanvas.height);
      const spacing = 24;
      const dotSize = 1.2;
      gridCtx.fillStyle = t.gridDot;
      for (let x = spacing; x < window.innerWidth; x += spacing) {
        for (let y = spacing; y < window.innerHeight - 48; y += spacing) {
          gridCtx.beginPath();
          gridCtx.arc(x, y, dotSize, 0, Math.PI * 2);
          gridCtx.fill();
        }
      }
    }

    // ── Draw Paths ──
    function redrawPaths() {
      drawCtx.clearRect(0, 0, drawCanvas.width, drawCanvas.height);
      for (const path of drawPaths) {
        drawStroke(path.points, path.color, path.width);
      }
    }

    function drawStroke(points, color, width) {
      if (points.length < 2) return;
      drawCtx.save();
      drawCtx.strokeStyle = color;
      drawCtx.lineWidth = width;
      drawCtx.lineCap = 'round';
      drawCtx.lineJoin = 'round';

      // Smooth curve through points for hand-drawn feel
      drawCtx.beginPath();
      drawCtx.moveTo(points[0].x, points[0].y);

      if (points.length === 2) {
        drawCtx.lineTo(points[1].x, points[1].y);
      } else {
        for (let i = 1; i < points.length - 1; i++) {
          const mx = (points[i].x + points[i + 1].x) / 2;
          const my = (points[i].y + points[i + 1].y) / 2;
          drawCtx.quadraticCurveTo(points[i].x, points[i].y, mx, my);
        }
        const last = points[points.length - 1];
        drawCtx.lineTo(last.x, last.y);
      }
      drawCtx.stroke();
      drawCtx.restore();
    }

    // ── Tool switching ──
    document.querySelectorAll('.tool-btn[data-tool]').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.tool-btn[data-tool]').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentTool = btn.dataset.tool;
        drawCanvas.className = currentTool === 'eraser' ? 'eraser-cursor' : '';
        drawCanvas.style.pointerEvents = (currentTool === 'marker' || currentTool === 'eraser') ? 'auto' : 'none';
        cardsLayer.style.pointerEvents = (currentTool === 'card' || currentTool === 'text') ? 'none' : 'none';
        // For text tool, we also need labels to be interactive
        document.querySelectorAll('.text-label').forEach(el => {
          el.style.pointerEvents = (currentTool === 'text' || currentTool === 'eraser') ? 'auto' : 'none';
        });
      });
    });

    // Init: card mode - drawing canvas doesn't capture
    drawCanvas.style.pointerEvents = 'none';

    // ── Theme switching ──
    document.querySelectorAll('.theme-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.theme-btn').forEach(b => b.classList.remove('active-theme'));
        btn.classList.add('active-theme');
        currentTheme = btn.dataset.theme;
        document.body.className = 'theme-' + currentTheme;
        drawGrid();
        saveState();
      });
    });

    // ── Marker drawing ──
    drawCanvas.addEventListener('mousedown', (e) => {
      if (currentTool === 'marker') {
        isDrawing = true;
        const t = themes[currentTheme];
        currentPath = { points: [{ x: e.clientX, y: e.clientY }], color: t.marker, width: 3 };
      } else if (currentTool === 'eraser') {
        eraseAt(e.clientX, e.clientY);
        isDrawing = true;
      }
    });

    drawCanvas.addEventListener('mousemove', (e) => {
      if (!isDrawing) return;
      if (currentTool === 'marker' && currentPath) {
        currentPath.points.push({ x: e.clientX, y: e.clientY });
        redrawPaths();
        drawStroke(currentPath.points, currentPath.color, currentPath.width);
      } else if (currentTool === 'eraser') {
        eraseAt(e.clientX, e.clientY);
      }
    });

    drawCanvas.addEventListener('mouseup', () => {
      if (currentTool === 'marker' && currentPath && currentPath.points.length > 1) {
        drawPaths.push(currentPath);
        saveState();
      }
      isDrawing = false;
      currentPath = null;
    });

    drawCanvas.addEventListener('mouseleave', () => {
      if (currentTool === 'marker' && currentPath && currentPath.points.length > 1) {
        drawPaths.push(currentPath);
        saveState();
      }
      isDrawing = false;
      currentPath = null;
    });

    // ── Eraser ──
    function eraseAt(x, y) {
      const radius = 18;
      // Erase draw paths
      drawPaths = drawPaths.filter(path => {
        return !path.points.some(p => Math.hypot(p.x - x, p.y - y) < radius);
      });
      redrawPaths();

      // Erase cards
      const toRemove = [];
      document.querySelectorAll('.card').forEach(card => {
        const rect = card.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          toRemove.push(card.dataset.id);
        }
      });
      if (toRemove.length) {
        cards = cards.filter(c => !toRemove.includes(c.id));
        renderCards();
        saveState();
      }

      // Erase text labels
      const textsToRemove = [];
      document.querySelectorAll('.text-label').forEach(label => {
        const rect = label.getBoundingClientRect();
        if (x >= rect.left && x <= rect.right && y >= rect.top && y <= rect.bottom) {
          textsToRemove.push(label.dataset.id);
        }
      });
      if (textsToRemove.length) {
        textLabels = textLabels.filter(t => !textsToRemove.includes(t.id));
        renderTextLabels();
        saveState();
      }
    }

    // ── Cards ──
    let cardIdCounter = 0;

    function createCard(x, y, text) {
      const id = 'card-' + (++cardIdCounter);
      const card = { id, x: x - 90, y: y - 30, text: text || '' };
      cards.push(card);
      renderCards();
      saveState();
      // Focus the new card for editing
      setTimeout(() => {
        const el = document.querySelector(`[data-id="${id}"] .card-content`);
        if (el) el.focus();
      }, 50);
    }

    function renderCards() {
      cardsLayer.innerHTML = '';
      for (const card of cards) {
        const el = document.createElement('div');
        el.className = 'card';
        el.dataset.id = card.id;
        el.style.left = card.x + 'px';
        el.style.top = card.y + 'px';

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '×';
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          cards = cards.filter(c => c.id !== card.id);
          renderCards();
          saveState();
        });

        const content = document.createElement('div');
        content.className = 'card-content';
        content.contentEditable = true;
        content.innerHTML = parseCardText(card.text);
        content.addEventListener('input', () => {
          card.text = content.innerText;
          saveState();
        });
        content.addEventListener('blur', () => {
          content.innerHTML = parseCardText(card.text);
          saveState();
        });
        content.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('checkbox')) return;
          // Only drag from edges, allow edit inside
        });

        el.appendChild(del);
        el.appendChild(content);

        // Drag
        el.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('checkbox') || e.target.classList.contains('delete-btn')) return;
          if (e.target.classList.contains('card-content') && document.activeElement === e.target) return;
          dragCard = card;
          dragOffset.x = e.clientX - card.x;
          dragOffset.y = e.clientY - card.y;
          el.style.zIndex = 50;
          e.preventDefault();
        });

        cardsLayer.appendChild(el);
      }

      // Checkbox click delegation
      cardsLayer.addEventListener('click', (e) => {
        if (e.target.classList.contains('checkbox')) {
          e.target.classList.toggle('checked');
          const cardEl = e.target.closest('.card');
          const card = cards.find(c => c.id === cardEl.dataset.id);
          if (card) {
            // Update text to toggle checkbox
            const lines = card.text.split('\n');
            const lineIdx = parseInt(e.target.dataset.line);
            if (lines[lineIdx]) {
              if (lines[lineIdx].startsWith('[x] ')) {
                lines[lineIdx] = '[ ] ' + lines[lineIdx].slice(4);
              } else if (lines[lineIdx].startsWith('[ ] ')) {
                lines[lineIdx] = '[x] ' + lines[lineIdx].slice(4);
              }
              card.text = lines.join('\n');
              cardEl.querySelector('.card-content').innerHTML = parseCardText(card.text);
              saveState();
            }
          }
        }
      });
    }

    function parseCardText(text) {
      if (!text) return '<span style="opacity:0.5">Type here...</span>';
      const lines = text.split('\n');
      return lines.map((line, i) => {
        if (line.startsWith('[x] ')) {
          return `<div><span class="checkbox checked" data-line="${i}"></span><span style="text-decoration:line-through;opacity:0.6">${esc(line.slice(4))}</span></div>`;
        }
        if (line.startsWith('[ ] ')) {
          return `<div><span class="checkbox" data-line="${i}"></span>${esc(line.slice(4))}</div>`;
        }
        if (line.startsWith('**') && line.endsWith('**')) {
          return `<div><strong>${esc(line.slice(2, -2))}</strong></div>`;
        }
        return `<div>${esc(line) || '<br>'}</div>`;
      }).join('');
    }

    function esc(s) {
      return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
    }

    // ── Text Labels ──
    let dragLabel = null;

    function createTextLabel(x, y) {
      const id = 'text-' + (++textIdCounter);
      const t = themes[currentTheme];
      const label = { id, x, y, text: '', color: t.marker };
      textLabels.push(label);
      renderTextLabels();
      saveState();
      setTimeout(() => {
        const el = document.querySelector(`[data-id="${id}"] .text-input`);
        if (el) el.focus();
      }, 50);
    }

    function renderTextLabels() {
      // Remove old text labels
      document.querySelectorAll('.text-label').forEach(el => el.remove());

      for (const label of textLabels) {
        const el = document.createElement('div');
        el.className = 'text-label';
        el.dataset.id = label.id;
        el.style.left = label.x + 'px';
        el.style.top = label.y + 'px';
        el.style.color = label.color;

        const del = document.createElement('button');
        del.className = 'delete-btn';
        del.textContent = '×';
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          textLabels = textLabels.filter(t => t.id !== label.id);
          renderTextLabels();
          saveState();
        });

        const input = document.createElement('span');
        input.className = 'text-input';
        input.contentEditable = true;
        input.style.outline = 'none';
        input.style.minWidth = '20px';
        input.style.display = 'inline-block';
        input.textContent = label.text || '';
        if (!label.text) input.setAttribute('data-placeholder', 'Type...');
        input.addEventListener('input', () => {
          label.text = input.textContent;
          saveState();
        });
        input.addEventListener('focus', () => {
          input.removeAttribute('data-placeholder');
        });
        input.addEventListener('blur', () => {
          if (!label.text) input.setAttribute('data-placeholder', 'Type...');
          saveState();
        });

        el.appendChild(del);
        el.appendChild(input);

        // Drag
        el.addEventListener('mousedown', (e) => {
          if (e.target.classList.contains('delete-btn')) return;
          if (e.target.classList.contains('text-input') && document.activeElement === e.target) return;
          dragLabel = label;
          dragOffset.x = e.clientX - label.x;
          dragOffset.y = e.clientY - label.y;
          e.preventDefault();
        });

        cardsLayer.appendChild(el);
      }
    }

    // Mouse for drag & card/label placement
    document.addEventListener('mousemove', (e) => {
      if (dragCard) {
        dragCard.x = e.clientX - dragOffset.x;
        dragCard.y = e.clientY - dragOffset.y;
        const el = document.querySelector(`[data-id="${dragCard.id}"]`);
        if (el) {
          el.style.left = dragCard.x + 'px';
          el.style.top = dragCard.y + 'px';
        }
      }
      if (dragLabel) {
        dragLabel.x = e.clientX - dragOffset.x;
        dragLabel.y = e.clientY - dragOffset.y;
        const el = document.querySelector(`[data-id="${dragLabel.id}"]`);
        if (el) {
          el.style.left = dragLabel.x + 'px';
          el.style.top = dragLabel.y + 'px';
        }
      }
    });

    document.addEventListener('mouseup', () => {
      if (dragCard) {
        saveState();
        dragCard = null;
      }
      if (dragLabel) {
        saveState();
        dragLabel = null;
      }
    });

    // Click on canvas to add card or text
    document.getElementById('app').addEventListener('click', (e) => {
      if (e.target !== gridCanvas && e.target !== drawCanvas) return;
      if (currentTool === 'card') {
        createCard(e.clientX, e.clientY, '');
      } else if (currentTool === 'text') {
        createTextLabel(e.clientX, e.clientY);
      }
    });

    // ── Clear Canvas ──
    document.getElementById('clear-btn').addEventListener('click', () => {
      if (confirm('Clear everything?')) {
        cards = [];
        textLabels = [];
        drawPaths = [];
        cardIdCounter = 0;
        textIdCounter = 0;
        renderCards();
        renderTextLabels();
        redrawPaths();
        saveState();
      }
    });

    // ── Persistence ──
    function saveState() {
      localStorage.setItem('cutetodo', JSON.stringify({
        cards, drawPaths, cardIdCounter, textLabels, textIdCounter, currentTheme
      }));
    }

    function loadState() {
      try {
        const data = JSON.parse(localStorage.getItem('cutetodo'));
        if (data) {
          cards = data.cards || [];
          textLabels = data.textLabels || [];
          textIdCounter = data.textIdCounter || 0;
          drawPaths = data.drawPaths || [];
          cardIdCounter = data.cardIdCounter || 0;
          if (data.currentTheme) {
            currentTheme = data.currentTheme;
            document.body.className = 'theme-' + currentTheme;
            document.querySelectorAll('.theme-btn').forEach(b => {
              b.classList.toggle('active-theme', b.dataset.theme === currentTheme);
            });
          }
        }
      } catch(e) {}
    }

    // ── Keyboard shortcut ──
    document.addEventListener('keydown', (e) => {
      if (document.activeElement && document.activeElement.contentEditable === 'true') return;
      if (e.key === '1') document.getElementById('card-btn').click();
      if (e.key === '2') document.getElementById('text-btn').click();
      if (e.key === '3') document.getElementById('marker-btn').click();
      if (e.key === '4') document.getElementById('eraser-btn').click();
    });

    // ── Init ──
    loadState();
    resize();
    renderCards();
    renderTextLabels();
  </script>
</body>
</html>
